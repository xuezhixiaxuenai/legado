name: Build Mod APK

# 自用构建：官方源码 + 「导入后自动上传书籍到 WebDAV」补丁
on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK platform 36
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure signing
        run: |
          echo "RELEASE_STORE_FILE=./legado-mod.jks" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=legadomod2026" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=legado" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=legadomod2026" >> gradle.properties
          echo "--- 签名配置已写入 ---"
          tail -4 gradle.properties

      - name: Build release APK (arm only)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAppRelease -ParmOnly=true --build-cache --parallel --daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -type f -exec cp {} out/ \;
          echo "=== 产物 ==="
          ls -lh out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado-mod-apk
          path: out/*.apk
          if-no-files-found: error
